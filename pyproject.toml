[build-system]
requires = ["flit_core >=3.2,<4"]
build-backend = "flit_core.buildapi"

[project]
name = "hanime-plugin"
version = "2026.07.11"
description = "hanime extractor plugin for yt-dlp"
authors = [
  { name = "Cynthia", email = "cynthia2048@proton.me" }
]
dependencies = [
  "pycryptodomex>=3.23"
]
readme = "README.md"
requires-python = ">=3.9"

[project.optional-dependencies]
# Used by the e2e test harness under `tests/`. `curl_cffi` powers the
# `--impersonate chrome` modes, which most cookie-fronted sites need.
test = [
  "pytest>=8",
  "curl_cffi",
]

[tool.flit.module]
name = "yt_dlp_plugins"
